<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM API Logs Dashboard</title>
    <!-- Use Inter font for a modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            /* Tailwind slate-900 */
            --panel-bg: #1e293b;
            /* Tailwind slate-800 */
            --text-main: #f8fafc;
            /* Tailwind slate-50 */
            --text-muted: #94a3b8;
            /* Tailwind slate-400 */
            --border-color: #334155;
            /* Tailwind slate-700 */
            --accent-color: #3b82f6;
            /* Tailwind blue-500 */
            --success-color: #10b981;
            /* Tailwind emerald-500 */
            --error-color: #ef4444;
            /* Tailwind red-500 */
            --hover-bg: #2dd4bf1a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .refresh-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            cursor: pointer;
            transition: opacity 0.2s;
            font-family: inherit;
        }

        .refresh-btn:hover {
            opacity: 0.9;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--panel-bg);
            border-radius: 0.5rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        th,
        td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: rgba(0, 0, 0, 0.2);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr {
            transition: background-color 0.2s;
            cursor: pointer;
        }

        tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .method-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .method-GET {
            background-color: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        .method-POST {
            background-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        .method-LLM {
            background-color: rgba(167, 139, 250, 0.2);
            color: #c084fc;
        }

        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
            font-weight: 500;
        }

        .status-success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
        }

        .status-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
        }

        .latency {
            font-family: monospace;
            color: var(--text-muted);
        }

        .endpoint {
            font-family: monospace;
            font-size: 0.875rem;
            word-break: break-all;
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background-color: var(--panel-bg);
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .modal-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin: 0;
            font-family: monospace;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .close-btn:hover {
            color: white;
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
        }

        .json-block {
            background-color: #000000;
            padding: 1rem;
            border-radius: 0.375rem;
            overflow-x: auto;
            font-family: monospace;
            font-size: 0.875rem;
            color: #a78bfa;
            white-space: pre-wrap;
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>CRM API Logs Dashboard</h1>
            <button class="refresh-btn" onclick="fetchLogs()">⟳ Refresh Logs</button>
        </header>
        <table id="logsTable">
            <thead>
                <tr>
                    <th>Method</th>
                    <th>Endpoint</th>
                    <th>Status</th>
                    <th>Latency</th>
                    <th>Timestamp</th>
                </tr>
            </thead>
            <tbody>
                <!-- Logs will be populated here -->
            </tbody>
        </table>
    </div>
    <!-- Modal -->
    <div class="modal-overlay" id="logModal" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">GET /api/v1/users</h2>
                <button class="close-btn" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="section-title">Request Payload</div>
                <div class="json-block" id="modalRequest"></div>

                <div class="section-title">Response Body</div>
                <div class="json-block" id="modalResponse" style="color: #34d399;"></div>
            </div>
        </div>
    </div>
    <script>
        let logsData = [];
        async function fetchLogs() {
            const tbody = document.querySelector('#logsTable tbody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">Loading logs...</td></tr>';

            try {
                const response = await fetch('/api/logs');
                logsData = await response.json();
                renderLogs(logsData);
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--error-color);">Failed to load logs: ${error.message}</td></tr>`;
            }
        }
        function renderLogs(logs) {
            const tbody = document.querySelector('#logsTable tbody');
            tbody.innerHTML = '';
            if (logs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--text-muted);">No logs found. Make some CRM calls!</td></tr>';
                return;
            }
            logs.forEach((log, index) => {
                const tr = document.createElement('tr');
                tr.onclick = () => openModal(index);

                const isSuccess = log.status_code >= 200 && log.status_code < 300;
                const statusClass = isSuccess ? 'status-success' : 'status-error';

                // Format date
                const date = new Date(log.created_at);
                const timeStr = date.toLocaleString('en-GB', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit'
                });

                tr.innerHTML = `
                <td><span class="method-badge method-${log.method}">${log.method}</span></td>
                <td class="endpoint">${log.endpoint}</td>
                <td><span class="status-badge ${statusClass}">${log.status_code || 'Err'}</span></td>
                <td class="latency">${log.latency_ms ? log.latency_ms.toFixed(0) + 'ms' : '-'}</td>
                <td style="color: var(--text-muted); font-size: 0.875rem;">${timeStr}</td>
            `;
                tbody.appendChild(tr);
            });
        }
        function openModal(index) {
            const log = logsData[index];
            if (!log) return;
            document.getElementById('modalTitle').textContent = `${log.method} ${log.endpoint}`;

            const reqBlock = document.getElementById('modalRequest');
            if (log.request_payload) {
                reqBlock.textContent = JSON.stringify(log.request_payload, null, 2);
            } else {
                reqBlock.textContent = "No payload (or not captured)";
            }
            const resBlock = document.getElementById('modalResponse');
            if (log.response_body) {
                resBlock.textContent = JSON.stringify(log.response_body, null, 2);
                // Change color based on status
                resBlock.style.color = (log.status_code >= 200 && log.status_code < 300) ? '#34d399' : '#f87171';
            } else {
                resBlock.textContent = "No response body";
                resBlock.style.color = 'var(--text-muted)';
            }
            document.getElementById('logModal').classList.add('active');
        }
        function closeModal(event) {
            if (event && event.target !== document.getElementById('logModal')) return;
            document.getElementById('logModal').classList.remove('active');
        }
        // Load on start
        fetchLogs();
    </script>
</body>

</html>
